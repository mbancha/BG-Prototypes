# Builds every prototype under games/ and publishes them to GitHub Pages, so
# playtesters get a link instead of a toolchain.
#
# ONLY `main` PUBLISHES. Every other branch builds as a check and stops
# there, so a work-in-progress branch can never overwrite the playtest link.
#
# Games live at https://<user>.github.io/<repo>/<game>/
#
# Each game sets base: "./" in its vite.config.ts, which is what lets the
# same build work from a subpath.
#
# Do not add a second Pages workflow (the "Configure" buttons on the repo's
# Pages settings offer to write one). Two workflows publishing to Pages fight
# over the same site, and the Jekyll one would publish the repo root instead
# of the games.

name: Deploy playtest builds

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One run per branch. A new push supersedes an older run on the SAME branch,
# but a feature-branch build can no longer cancel a deploy of main — which is
# what used to happen when every branch shared a single "pages" group.
concurrency:
  group: playtest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build every game
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1" # smoke-test dep, not needed here
        run: |
          set -e
          mkdir -p site
          for dir in games/*/; do
            name=$(basename "$dir")
            echo "::group::$name"
            (
              cd "$dir"
              npm ci --no-audit --no-fund || npm install --no-audit --no-fund
              npm run build
            )
            cp -r "$dir/dist" "site/$name"
            echo "::endgroup::"
          done

      - name: Write index page
        run: |
          {
            echo '<!doctype html><meta charset="utf-8"><title>Playtest builds</title>'
            echo '<style>body{background:#07090f;color:#c6d3e6;font-family:ui-monospace,monospace;padding:48px;line-height:1.8}'
            echo 'h1{letter-spacing:6px;color:#eaf6ff}a{color:#00e5ff}small{color:#6b7b95}</style>'
            echo '<h1>PLAYTEST BUILDS</h1><small>built from '"$GITHUB_SHA"'</small><ul>'
            for dir in games/*/; do
              n=$(basename "$dir")
              echo "<li><a href=\"./$n/\">$n</a></li>"
            done
            echo '</ul>'
          } > site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # Publishing is main-only; other branches stop after the build above.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    # Pages allows one deployment at a time. For a playtest site the newest
    # build is always the one we want, so a superseded deploy is cancelled
    # rather than left to finish and overwrite it.
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
